<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>PixOnDeck</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body class="auth-pending" aria-busy="true">
    <div class="startup-loading" role="status"><span class="loading-spinner" aria-hidden="true"></span><span id="startupLabel"></span></div>
    <section id="welcome" class="welcome" aria-labelledby="welcomeTitle" hidden>
      <div class="welcome-content">
        <img class="welcome-logo" src="logo.svg" alt="PixOnDeck" width="158" height="40">
        <div class="welcome-demo">
          <video id="welcomeDemo" autoplay muted loop playsinline preload="metadata" poster="assets/welcome-demo-poster.jpg" width="560" height="320">
            <source src="assets/welcome-demo.mp4" type="video/mp4">
          </video>
        </div>
        <h1 id="welcomeTitle"></h1>
        <p id="welcomeDescription"></p>
        <button id="login" class="welcome-login"></button>
        <p id="guestStatus" role="status" aria-live="polite" hidden></p>
      </div>
    </section>
    <header>
      <a class="brand-row" href="https://pixondeck.com/" target="_blank" rel="noopener noreferrer" aria-label="PixOnDeck">
        <img
          class="brand-logo"
          src="logo.svg"
          alt="PixOnDeck"
          width="95"
          height="24"
        />
      </a>

      <div class="upload-entry"><span id="uploadHint" class="upload-hint"></span><button id="uploadButton" class="upload-button"></button></div>
      <button id="favoritesToggle" class="favorites-toggle" type="button" aria-pressed="false"><span id="favoritesIcon" aria-hidden="true"></span><span id="favoritesLabel"></span><span id="favoritesCount">0</span></button>
      <input
        id="upload"
        type="file"
        accept="image/jpeg,image/png,image/webp,image/gif"
        hidden
      />
    </header>
    <section id="accountMenu" class="account-menu" role="dialog" aria-labelledby="menuName" hidden>
      <div class="menu-profile"><span class="menu-avatar"><img id="menuAvatar" alt="" referrerpolicy="no-referrer" hidden><span id="menuFallback"></span></span><div class="menu-profile-text"><strong id="menuName"></strong><span id="menuEmail"></span></div></div>
      <div class="mode-options" role="group" aria-labelledby="modeLabel"><span id="modeLabel"><svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><g fill="none" stroke="currentColor" stroke-width="1.5"><path stroke-linejoin="round" d="M2.5 12c0-4.478 0-6.718 1.391-8.109S7.521 2.5 12 2.5c4.478 0 6.718 0 8.109 1.391S21.5 7.521 21.5 12c0 4.478 0 6.718-1.391 8.109S16.479 21.5 12 21.5c-4.478 0-6.718 0-8.109-1.391S2.5 16.479 2.5 12Z"/><path d="M10 15.5a1.5 1.5 0 1 1-3 0a1.5 1.5 0 0 1 3 0Zm7-7a1.5 1.5 0 1 0-3 0a1.5 1.5 0 0 0 3 0Z"/><path stroke-linecap="round" d="M8.5 14V7m7 3v7"/></g></svg><span id="modeLabelText"></span></span><button id="modeCredits" type="button" aria-pressed="true"><span class="mode-brand-mark"><img src="logo.svg" alt="PixOnDeck" width="79" height="20"></span></button><button id="modeByok" type="button" aria-pressed="false">BYOK</button></div>
      <button id="byokConfigure" class="account-menu-link" type="button" hidden></button>
      <a id="menuCredits" class="account-menu-link" target="_blank" rel="noopener noreferrer"><span class="menu-icon" id="menuCreditsIcon" aria-hidden="true"></span><span id="menuCreditsLabel"></span><strong id="menuBalance">—</strong></a>
      <hr class="mode-divider">
      <a id="menuReleases" class="account-menu-link" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m12.88 7.017l4.774 1.271m-5.796 2.525l2.386.636m-2.267 6.517l.954.255c2.7.72 4.05 1.079 5.114.468c1.063-.61 1.425-1.953 2.148-4.637l1.023-3.797c.724-2.685 1.085-4.027.471-5.085s-1.963-1.417-4.664-2.136l-.954-.255c-2.7-.72-4.05-1.079-5.113-.468c-1.064.61-1.426 1.953-2.15 4.637l-1.022 3.797c-.724 2.685-1.086 4.027-.471 5.085c.614 1.057 1.964 1.417 4.664 2.136Z" /><path d="m12 20.946l-.952.26c-2.694.733-4.04 1.1-5.102.477c-1.06-.622-1.422-1.991-2.143-4.728l-1.021-3.872c-.722-2.737-1.083-4.106-.47-5.184C2.842 6.966 4 7 5.5 7" /></svg><span id="menuReleasesLabel"></span></a>
      <button id="menuLanguage" class="account-menu-link menu-language" aria-expanded="false" aria-controls="languageOptions"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" /><path d="M8 12c0 6 4 10 4 10s4-4 4-10s-4-10-4-10s-4 4-4 10Z" /><path d="M21 15H3m18-6H3" /></svg><span id="menuLanguageLabel"></span><span id="currentLanguage"></span><svg class="language-chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg></button><div id="languageOptions" class="language-options" hidden></div>
      <a id="menuSupport" class="account-menu-link" target="_blank" rel="noopener noreferrer"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 8.5l2.942 1.74c1.715 1.014 2.4 1.014 4.116 0L17 8.5" /><path d="M2.016 13.476c.065 3.065.098 4.598 1.229 5.733c1.131 1.136 2.705 1.175 5.854 1.254c1.94.05 3.862.05 5.802 0c3.149-.079 4.723-.118 5.854-1.254c1.131-1.135 1.164-2.668 1.23-5.733c.02-.986.02-1.966 0-2.952c-.066-3.065-.099-4.598-1.23-5.733c-1.131-1.136-2.705-1.175-5.854-1.254a115 115 0 0 0-5.802 0c-3.149.079-4.723.118-5.854 1.254c-1.131 1.135-1.164 2.668-1.23 5.733a69 69 0 0 0 0 2.952Z" /></svg><span id="menuSupportLabel"></span></a>
      <button id="menuLogout" class="account-menu-link menu-logout"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M15.5 8.04c-.041-1.16-.178-1.885-.636-2.453c-.653-.812-1.77-1.066-4.004-1.576l-1-.228c-3.395-.774-5.092-1.161-6.226-.27C2.5 4.405 2.5 6.126 2.5 9.568v4.864c0 3.442 0 5.164 1.134 6.055s2.83.504 6.225-.27l1.002-.228c2.233-.51 3.35-.764 4.003-1.576c.458-.567.595-1.293.636-2.453m3-6.948s3 2.21 3 3s-3 3-3 3m2.5-3H8.5" /></svg><span id="menuLogoutLabel"></span></button>
    </section>
    <section id="settingsMenu" class="settings-menu" hidden>
      <p id="site"></p>
      <button id="current"></button><button id="all"></button
      ><button id="disable"></button>
    </section>
    <div class="workspace">
      <main>
        <section class="prompt-card">
          <div id="taskToolbar" class="task-toolbar" hidden>
            <span id="taskInfo"></span><button id="retry" class="text-button" disabled></button>
          </div>
          <p id="status" role="status" aria-live="polite" hidden></p>
          <div id="favoriteConflict" class="favorite-conflict" hidden><button id="favoriteLoadCloud" type="button"></button><button id="favoriteKeepMine" type="button"></button></div>
          <button id="permission" hidden></button>
          <section id="emptyState" class="empty-state" aria-labelledby="emptyTitle" hidden>
            <div class="empty-illustration" aria-hidden="true">
              <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="7" width="36" height="34" rx="7"/><circle cx="17" cy="18" r="3"/><path d="m8 33 10-10 8 8 6-6 9 9"/></svg>
              <span class="empty-sparkle">✦</span>
            </div>
            <h2 id="emptyTitle"></h2>
            <p id="emptyDescription"></p>
            <button id="emptyUpload" type="button"></button>
            <p id="emptyHint" class="empty-hint"></p>
          </section>
          <div id="taskContent" role="tabpanel" hidden>
            <div class="prompt-editor">
              <textarea id="prompt" maxlength="1800" rows="16"></textarea>
              <div id="promptLoading" role="status" aria-live="polite" hidden><span class="loading-spinner" aria-hidden="true"></span><span id="promptLoadingText"></span></div>
            </div>
            <div class="actions">
              <button id="copy" disabled><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M9 15c0-2.828 0-4.243.879-5.121C10.757 9 12.172 9 15 9h1c2.828 0 4.243 0 5.121.879C22 10.757 22 12.172 22 15v1c0 2.828 0 4.243-.879 5.121C20.243 22 18.828 22 16 22h-1c-2.828 0-4.243 0-5.121-.879C9 20.243 9 18.828 9 16z"/><path d="M17 9c-.003-2.957-.047-4.489-.908-5.538a4 4 0 0 0-.554-.554C14.43 2 12.788 2 9.5 2c-3.287 0-4.931 0-6.038.908a4 4 0 0 0-.554.554C2 4.57 2 6.212 2 9.5c0 3.287 0 4.931.908 6.038a4 4 0 0 0 .554.554c1.05.86 2.58.906 5.538.908"/></g></svg><span id="copyLabel"></span></button>

            </div>
          </div>
        </section>
      </main>
      <aside class="task-rail">
        <nav id="tasks" role="tablist" aria-orientation="vertical"></nav>
        <div class="account-block">
          <button
            id="accountIdentity"
            class="account-identity"
            aria-expanded="false"
            aria-controls="accountMenu"
            hidden
          >
            <span class="account-credits"
              ><svg
                xmlns="http://www.w3.org/2000/svg"
                viewBox="0 0 24 24"
                width="16"
                height="16"
                fill="currentColor"
                stroke="currentColor"
                stroke-linejoin="round"
                stroke-width="2"
                aria-hidden="true"
              >
                <path
                  d="M8 15C12.8747 15 15 12.949 15 8C15 12.949 17.1104 15 22 15C17.1104 15 15 17.1104 15 22C15 17.1104 12.8747 15 8 15Z"
                />
                <path
                  d="M2 6.5C5.13376 6.5 6.5 5.18153 6.5 2C6.5 5.18153 7.85669 6.5 11 6.5C7.85669 6.5 6.5 7.85669 6.5 11C6.5 7.85669 5.13376 6.5 2 6.5Z"
                /></svg
              ><span id="balance"></span
            ></span>
            <span class="account-profile">
            <span class="avatar"
              ><img
                id="avatarImage"
                alt=""
                referrerpolicy="no-referrer"
                hidden /><span id="avatarFallback"></span
            ></span>
              <span id="accountName" class="account-name"></span>
            </span>
          </button>
        </div>
      </aside>
    </div>
    <dialog id="byokDialog" class="byok-dialog" aria-labelledby="byokTitle">
      <form id="byokForm" novalidate>
        <h2 id="byokTitle"></h2>
        <label><span id="byokEndpointLabel"></span><input id="byokEndpoint" type="url" inputmode="url" autocomplete="off" spellcheck="false" placeholder="https://api.openai.com/v1"></label>
        <label><span id="byokKeyLabel"></span><input id="byokKey" type="password" autocomplete="off" spellcheck="false" maxlength="4096"></label>
        <div class="byok-model-field">
          <div class="byok-model-heading"><label id="byokModelLabel" for="byokModel"></label><button id="byokFetchModels" type="button"></button></div>
          <div class="byok-model-combobox" id="byokModelCombobox">
            <input id="byokModel" type="text" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="byokModels" aria-describedby="byokModelsStatus" autocomplete="off" spellcheck="false" maxlength="200" placeholder="gpt-4.1-mini">
            <button id="byokModelsToggle" class="byok-model-toggle" type="button" tabindex="-1" aria-controls="byokModels" aria-expanded="false" hidden><svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="m6 9 6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
            <div id="byokModels" class="byok-model-options" role="listbox" hidden></div>
          </div>
          <p id="byokModelsStatus" role="status" aria-live="polite" hidden></p>
        </div>
        <div class="byok-notice">
          <p id="byokDisclosure"></p>
          <label class="byok-consent"><input id="byokConsent" type="checkbox"><span id="byokConsentLabel"></span></label>
        </div>
        <p id="byokError" role="alert" hidden></p>
        <div class="byok-dialog-actions"><button id="byokClear" type="button"></button><button id="byokClose" type="button"></button><button id="byokSave" type="submit"></button></div>
      </form>
    </dialog>
    <div id="byokToast" class="panel-toast" role="status" aria-live="polite" hidden></div>
    <div id="dropOverlay" role="status" aria-live="polite" hidden></div>
    <script src="panel.js"></script>
  </body>
</html>
